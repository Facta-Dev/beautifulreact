name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - react-best-practices (writing code)
        - react-review (reviewing code)
        - react-port (porting to React)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the React 19 docs, the React patterns handbook, the TypeScript strict handbook, the facta frontend handbook, the typescript-eslint rule docs, the WAI-ARIA Authoring Practices, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: typescript
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: typescript
